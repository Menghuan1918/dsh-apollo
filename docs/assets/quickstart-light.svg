<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc"><title id="title">60 秒开始使用 Better DSH</title><desc id="desc">安装一次，五行自动装配；重启 profile 后生效。</desc><defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#E6EDF5" stroke-width="1" opacity="0.7"/></pattern>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#2F80B7" stop-opacity="0.20"/><stop offset="100%" stop-color="#2F80B7" stop-opacity="0"/></radialGradient>
<radialGradient id="glow2" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#1E6A9E" stop-opacity="0.12"/><stop offset="100%" stop-color="#1E6A9E" stop-opacity="0"/></radialGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DCE5F0"/></marker>
<marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F80B7"/></marker>
</defs><rect x="0" y="0" width="1600" height="560" fill="#F6F8FB"/><rect x="0" y="0" width="1600" height="560" fill="url(#grid)" opacity="0.55"/><rect x="0.5" y="0.5" width="1599" height="559" fill="none" stroke="#DCE5F0" stroke-width="1" opacity="0.9"/><text x="80" y="74" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="40" font-weight="700" fill="#0B1524" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">60 秒开始</text><text x="80" y="112" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="400" fill="#5B6B80" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">安装一次，五行自动装配；重启 profile 后生效</text><rect x="80" y="180" width="320" height="280" rx="16" fill="#FFFFFF" stroke="#DCE5F0" stroke-width="1" opacity="1"/><rect x="80" y="180" width="320" height="5" rx="2.5" fill="#2F80B7"/><circle cx="108" cy="222" r="16" fill="#E8F2FA" opacity="1"/><text x="108" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" fill="#2F80B7" text-anchor="middle" dominant-baseline="middle" opacity="1" letter-spacing="0">01</text><text x="136" y="222" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700" fill="#0B1524" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">安装</text><text x="104" y="268" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="400" fill="#5B6B80" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">只加根 bundle；五个插件</text><text x="104" y="290" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="400" fill="#5B6B80" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">作为精确依赖自动安装。</text><rect x="104" y="330" width="272" height="84" rx="10" fill="#0F172A" stroke="#DCE5F0" stroke-width="1" opacity="1"/><text x="120" y="360" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#7CC8F2" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">$ dsh plugin add</text><text x="120" y="384" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#E2E8F0" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">  dsh-better-dsh</text><text x="104" y="432" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#8A99AC" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">npm / GitHub tag 均可</text><rect x="440" y="180" width="320" height="280" rx="16" fill="#FFFFFF" stroke="#DCE5F0" stroke-width="1" opacity="1"/><rect x="440" y="180" width="320" height="5" rx="2.5" fill="#2F80B7"/><circle cx="468" cy="222" r="16" fill="#E8F2FA" opacity="1"/><text x="468" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" fill="#2F80B7" text-anchor="middle" dominant-baseline="middle" opacity="1" letter-spacing="0">02</text><text x="496" y="222" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700" fill="#0B1524" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">装配</text><text x="464" y="268" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="400" fill="#5B6B80" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">bundle patch 插入五行；</text><text x="464" y="290" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="400" fill="#5B6B80" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">按行 id 只激活一份实例。</text><rect x="464" y="326" width="272" height="18" rx="5" fill="#F1F5F9" stroke="#DCE5F0" stroke-width="1" opacity="1"/><circle cx="476" cy="335" r="3" fill="#2E9E6B" opacity="1"/><text x="486" y="335" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">Goal</text><rect x="464" y="350" width="272" height="18" rx="5" fill="#F1F5F9" stroke="#DCE5F0" stroke-width="1" opacity="1"/><circle cx="476" cy="359" r="3" fill="#7A5AF8" opacity="1"/><text x="486" y="359" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">Subagent</text><rect x="464" y="374" width="272" height="18" rx="5" fill="#F1F5F9" stroke="#DCE5F0" stroke-width="1" opacity="1"/><circle cx="476" cy="383" r="3" fill="#D97706" opacity="1"/><text x="486" y="383" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">Compact</text><rect x="464" y="398" width="272" height="18" rx="5" fill="#F1F5F9" stroke="#DCE5F0" stroke-width="1" opacity="1"/><circle cx="476" cy="407" r="3" fill="#2F80B7" opacity="1"/><text x="486" y="407" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">Ask</text><rect x="464" y="422" width="272" height="18" rx="5" fill="#F1F5F9" stroke="#DCE5F0" stroke-width="1" opacity="1"/><circle cx="476" cy="431" r="3" fill="#0E7490" opacity="1"/><text x="486" y="431" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">PTC</text><rect x="800" y="180" width="320" height="280" rx="16" fill="#FFFFFF" stroke="#DCE5F0" stroke-width="1" opacity="1"/><rect x="800" y="180" width="320" height="5" rx="2.5" fill="#2F80B7"/><circle cx="828" cy="222" r="16" fill="#E8F2FA" opacity="1"/><text x="828" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" fill="#2F80B7" text-anchor="middle" dominant-baseline="middle" opacity="1" letter-spacing="0">03</text><text x="856" y="222" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700" fill="#0B1524" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">设置</text><text x="824" y="268" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="400" fill="#5B6B80" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">一个集成弹窗聚合五行设置；</text><text x="824" y="290" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="400" fill="#5B6B80" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">保存写回同一份 profile。</text><rect x="824" y="326" width="272" height="18" rx="5" fill="#E8F2FA" stroke="#2F80B7" stroke-width="1" opacity="1"/><text x="836" y="335" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#14587F" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">Core</text><rect x="824" y="350" width="272" height="18" rx="5" fill="#F1F5F9" stroke="#DCE5F0" stroke-width="1" opacity="1"/><text x="836" y="359" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">Subagents</text><rect x="824" y="374" width="272" height="18" rx="5" fill="#F1F5F9" stroke="#DCE5F0" stroke-width="1" opacity="1"/><text x="836" y="383" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">Compaction</text><rect x="824" y="398" width="272" height="18" rx="5" fill="#F1F5F9" stroke="#DCE5F0" stroke-width="1" opacity="1"/><text x="836" y="407" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">Goals</text><rect x="824" y="422" width="272" height="18" rx="5" fill="#F1F5F9" stroke="#DCE5F0" stroke-width="1" opacity="1"/><text x="836" y="431" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">Questions</text><rect x="1160" y="180" width="320" height="280" rx="16" fill="#FFFFFF" stroke="#DCE5F0" stroke-width="1" opacity="1"/><rect x="1160" y="180" width="320" height="5" rx="2.5" fill="#2F80B7"/><circle cx="1188" cy="222" r="16" fill="#E8F2FA" opacity="1"/><text x="1188" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" fill="#2F80B7" text-anchor="middle" dominant-baseline="middle" opacity="1" letter-spacing="0">04</text><text x="1216" y="222" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="700" fill="#0B1524" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">开始工作</text><text x="1184" y="268" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="400" fill="#5B6B80" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">流程技能、工程预设、目标、</text><text x="1184" y="290" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="400" fill="#5B6B80" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">子代理与压缩立即可用。</text><rect x="1184" y="326" width="128" height="24" rx="12" fill="#F1F5F9" stroke="#DCE5F0" stroke-width="1" opacity="1"/><text x="1202" y="338" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="500" fill="#334155" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">/skills</text><rect x="1324" y="326" width="128" height="24" rx="12" fill="#F1F5F9" stroke="#DCE5F0" stroke-width="1" opacity="1"/><text x="1342" y="338" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="500" fill="#334155" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">eng</text><rect x="1184" y="356" width="128" height="24" rx="12" fill="#F1F5F9" stroke="#DCE5F0" stroke-width="1" opacity="1"/><text x="1202" y="368" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="500" fill="#334155" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">/goal</text><rect x="1324" y="356" width="128" height="24" rx="12" fill="#F1F5F9" stroke="#DCE5F0" stroke-width="1" opacity="1"/><text x="1342" y="368" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="500" fill="#334155" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">wait</text><rect x="1184" y="386" width="128" height="24" rx="12" fill="#F1F5F9" stroke="#DCE5F0" stroke-width="1" opacity="1"/><text x="1202" y="398" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="500" fill="#334155" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">compact</text><line x1="404" y1="320" x2="436" y2="320" stroke="#2F80B7" stroke-width="1.5" marker-end="url(#arrowA)" opacity="1"/><line x1="764" y1="320" x2="796" y2="320" stroke="#2F80B7" stroke-width="1.5" marker-end="url(#arrowA)" opacity="1"/><line x1="1124" y1="320" x2="1156" y2="320" stroke="#2F80B7" stroke-width="1.5" marker-end="url(#arrowA)" opacity="1"/><text x="80" y="516" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="400" fill="#5B6B80" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">安装 / 升级 / 换包后必须重启对应 profile；只刷新网页不够。</text></svg>
