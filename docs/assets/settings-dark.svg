<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">Better DSH 集成设置</title>
  <desc id="desc">一个弹窗聚合五个插件的设置页；保存写回同一份 profile。</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#122033" stroke-width="1" opacity="0.7"/></pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#4EB0E8" stop-opacity="0.20"/><stop offset="100%" stop-color="#4EB0E8" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#7CC8F2" stop-opacity="0.12"/><stop offset="100%" stop-color="#7CC8F2" stop-opacity="0"/></radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22314A"/></marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4EB0E8"/></marker>
  </defs>
  <rect x="0" y="0" width="1600" height="800" fill="#0A101B"/>
  <rect x="0" y="0" width="1600" height="800" fill="url(#grid)" opacity="0.55"/>
  <rect x="0.5" y="0.5" width="1599" height="799" fill="none" stroke="#22314A" stroke-width="1" opacity="0.9"/><text x="80" y="74" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="40" font-weight="700" fill="#F1F5F9" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">一份设置，五个页面</text><text x="80" y="112" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="400" fill="#9AA9BD" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">集成设置弹窗聚合每个插件自己的设置页；保存写回同一份 profile</text><rect x="100" y="150" width="1400" height="560" rx="18" fill="#101A2A" stroke="#22314A" stroke-width="1" opacity="1"/><rect x="100" y="150" width="1400" height="56" rx="18" fill="#0D1624" stroke="#22314A" stroke-width="1" opacity="1"/><rect x="100" y="178" width="1400" height="28" fill="#0D1624"/><circle cx="130" cy="178" r="5" fill="#F87171" opacity="1"/><circle cx="150" cy="178" r="5" fill="#FBBF24" opacity="1"/><circle cx="170" cy="178" r="5" fill="#34D399" opacity="1"/><text x="196" y="178" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="600" fill="#F1F5F9" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">Better DSH · 集成设置</text><text x="1470" y="178" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="400" fill="#9AA9BD" text-anchor="end" dominant-baseline="middle" opacity="1" letter-spacing="0">×</text><rect x="100" y="206" width="240" height="504" rx="0" fill="#0D1624" stroke="#22314A" stroke-width="1" opacity="1"/><rect x="100" y="206" width="1" height="504" fill="#22314A"/><rect x="116" y="240" width="208" height="44" rx="9" fill="#0F2A3D" stroke="#4EB0E8" stroke-width="1" opacity="1"/><circle cx="140" cy="262" r="5" fill="#4EB0E8" opacity="1"/><text x="158" y="262" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="600" fill="#8FD3F5" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">Core</text><rect x="116" y="298" width="208" height="44" rx="9" fill="transparent" stroke="transparent" stroke-width="1" opacity="1"/><circle cx="140" cy="320" r="5" fill="#6B7C93" opacity="1"/><text x="158" y="320" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="500" fill="#CBD5E1" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">Subagents</text><rect x="116" y="356" width="208" height="44" rx="9" fill="transparent" stroke="transparent" stroke-width="1" opacity="1"/><circle cx="140" cy="378" r="5" fill="#6B7C93" opacity="1"/><text x="158" y="378" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="500" fill="#CBD5E1" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">Compaction</text><rect x="116" y="414" width="208" height="44" rx="9" fill="transparent" stroke="transparent" stroke-width="1" opacity="1"/><circle cx="140" cy="436" r="5" fill="#6B7C93" opacity="1"/><text x="158" y="436" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="500" fill="#CBD5E1" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">Goals</text><rect x="116" y="472" width="208" height="44" rx="9" fill="transparent" stroke="transparent" stroke-width="1" opacity="1"/><circle cx="140" cy="494" r="5" fill="#6B7C93" opacity="1"/><text x="158" y="494" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="500" fill="#CBD5E1" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">Questions</text><text x="380" y="250" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="700" fill="#F1F5F9" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">Core</text><text x="380" y="282" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="400" fill="#9AA9BD" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">后台任务退出守卫与宿主访问</text><text x="380" y="334" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#6B7C93" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="1">EXIT GUARD</text><text x="380" y="372" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="500" fill="#F1F5F9" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">Wait for background work</text><rect x="1370" y="359" width="48" height="26" rx="13" fill="#162236" stroke="#22314A" stroke-width="1"/><circle cx="1382" cy="372" r="9" fill="#6B7C93" opacity="1"/><rect x="380" y="408" width="1040" height="112" rx="12" fill="#0D1624" stroke="#22314A" stroke-width="1" opacity="1"/><circle cx="470" cy="464" r="16" fill="#101A2A" stroke="#22314A"/><text x="470" y="464" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" fill="#4EB0E8" text-anchor="middle" dominant-baseline="middle" opacity="1" letter-spacing="0">1</text><text x="470" y="500" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="400" fill="#CBD5E1" text-anchor="middle" dominant-baseline="middle" opacity="1" letter-spacing="0">Turn ends</text><line x1="494" y1="464" x2="758" y2="464" stroke="#4EB0E8" stroke-width="1.3" marker-end="url(#arrowA)" opacity="1"/><circle cx="790" cy="464" r="16" fill="#101A2A" stroke="#22314A"/><text x="790" y="464" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" fill="#4EB0E8" text-anchor="middle" dominant-baseline="middle" opacity="1" letter-spacing="0">2</text><text x="790" y="500" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="400" fill="#CBD5E1" text-anchor="middle" dominant-baseline="middle" opacity="1" letter-spacing="0">Background jobs</text><line x1="814" y1="464" x2="1078" y2="464" stroke="#4EB0E8" stroke-width="1.3" marker-end="url(#arrowA)" opacity="1"/><circle cx="1110" cy="464" r="16" fill="#101A2A" stroke="#22314A"/><text x="1110" y="464" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="700" fill="#4EB0E8" text-anchor="middle" dominant-baseline="middle" opacity="1" letter-spacing="0">3</text><text x="1110" y="500" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="400" fill="#CBD5E1" text-anchor="middle" dominant-baseline="middle" opacity="1" letter-spacing="0">Allow completion</text><text x="380" y="566" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="600" fill="#6B7C93" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="1">CONNECTION AND ACCESS</text><text x="380" y="604" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="500" fill="#F1F5F9" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">Trust this reverse-proxied page as the host</text><rect x="1370" y="591" width="48" height="26" rx="13" fill="#162236" stroke="#22314A" stroke-width="1"/><circle cx="1382" cy="604" r="9" fill="#6B7C93" opacity="1"/><text x="380" y="654" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="400" fill="#9AA9BD" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">▸  Compatibility</text><text x="380" y="686" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="400" fill="#6B7C93" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">旧 profile 的迁移说明，默认折叠。</text><rect x="100" y="738" width="440" height="44" rx="10" fill="#0D1624" stroke="#22314A" stroke-width="1" opacity="1"/><circle cx="120" cy="760" r="4" fill="#4EB0E8" opacity="1"/><text x="134" y="760" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#CBD5E1" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">保存即生效</text><text x="260" y="760" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#9AA9BD" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">volatile 字段无需重挂</text><rect x="570" y="738" width="440" height="44" rx="10" fill="#0D1624" stroke="#22314A" stroke-width="1" opacity="1"/><circle cx="590" cy="760" r="4" fill="#4EB0E8" opacity="1"/><text x="604" y="760" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#CBD5E1" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">需要重载会标注</text><text x="730" y="760" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#9AA9BD" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">引擎 / 原生参数 / 安装</text><rect x="1040" y="738" width="440" height="44" rx="10" fill="#0D1624" stroke="#22314A" stroke-width="1" opacity="1"/><circle cx="1060" cy="760" r="4" fill="#4EB0E8" opacity="1"/><text x="1074" y="760" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#CBD5E1" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">只保留一个入口</text><text x="1200" y="760" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#9AA9BD" text-anchor="start" dominant-baseline="middle" opacity="1" letter-spacing="0">避免双显式 bundle 只读</text></svg>
