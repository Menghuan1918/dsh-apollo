# dsh-apollo bundle patch: inserts the single host-plane row for this package
# into the profile roster. Applied as a profile bundle layer (the first entry
# of the `dsh.bundle.patch` array in package.json — the eng/eng-noask preset
# patches in presets/ load after it); activate with
# `dsh plugin --profile <name> add link:<path-to>/dsh-apollo`.
#
# One row on purpose. The row's module specifier must be the bare package name
# because the browser half (`dsh.client` → exports "./client") is discovered
# from the row's package manifest: `dsh-client-modules` only accepts a bare or
# two-segment scoped specifier, and it rejects a second active row resolving to
# the same package name ("resolves from multiple active Loader sources"). So
# this one node half does every job:
#
#   1. registers the packaged skills/ tree on the skill registry's global layer
#      (every preset mounting tool-skill then exposes the catalog);
#   2. mounts the formal row Config (src/config.js, a @deepseek-ai/schemastery
#      schema) together with the configForm that edits it from Plugins →
#      Apollo; volatile fields apply without reloading this row;
#   3. registers the read-only capability endpoint /apollo/api/capabilities
#      (src/panel.js), which that form reads to show where each CLI resolved;
#   4. installs the CLI subagent bridge (src/subagents.js) over the existing
#      subagent tools — it adds no tool of its own;
#   5. when the row config sets `declareOwnsHost: true`, taps the index HTML so
#      the official client treats a proxied page as loopback.
#
# Row config — two classes of fields (details in README, section 配置):
#   - volatile, editable from the Web form: `exitGuard`,
#     `subagents.{eng,global}`, `subagents.{codex,claude}.*`
#     (enabled / executable / profile / permissionMode / defaultModel / models[]).
#     Changes do NOT reload this row.
#   - deployment flags, hand-written here, never edited from the Web form (the
#     settings layer rejects writes outside the volatile paths):
#     `trustedHosts: string[]` — reverse-proxy authorities additionally allowed
#     to call /apollo/api/* (loopback is always trusted);
#     `declareOwnsHost: boolean` — the boot global above; off by default,
#     enable only behind a trusted proxy.
#
# Presets are separate bundle-patch rows (presets/eng.patch.yml,
# presets/eng-noask.patch.yml): a preset is an `insert` of a
# `@deepseek-ai/dsh-agent-preset` row read straight from that file — the old
# sync-into-<dshHome>/.agent-presets delivery no longer exists.
- insert:
    - id: apollo-skills
      name: dsh-apollo
